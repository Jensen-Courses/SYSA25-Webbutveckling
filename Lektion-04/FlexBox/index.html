<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlexBox Demo</title>
    <style>
      body {
        font-family: Verdana, sans-serif;
        /* font-size: 16px; */
        font-size: 1rem;
      }

      .container {
        border: solid 1px #333;
        padding: 1rem;
      }

      .demo-1 {
        display: flex;
        flex-direction: row;
        justify-content: flex-start;
        gap: 1rem;
        flex-wrap: wrap;
      }

      .demo-2 {
        display: flex;
        flex-direction: row;
        justify-content: flex-start;
        /* align-items: center; */
        gap: 1rem;
        flex-wrap: wrap;
      }

      .demo-3 {
        display: flex;
        justify-content: space-evenly;
        flex-wrap: wrap;
      }

      .demo-4 {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 1rem;
        flex-wrap: wrap;
        height: 400px;
      }

      .demo-5 {
        font-size: 0.9rem;
        display: flex;
        gap: 1rem;
      }

      .demo-5 p {
        font-size: 1.2em;
      }

      .demo-5 div {
        font-size: 1em;
      }

      .box {
        display: flex;
        align-items: center;
        justify-content: center;
        border: solid 1px red;
        width: 50px;
        height: 50px;
        border-radius: 0.5rem;
      }
    </style>
  </head>
  <body>
    <h4>Basic Flexbox</h4>
    <section class="container demo-1">
      <div class="box">Box 1</div>
      <div class="box">Box 2</div>
      <div class="box">Box 3</div>
      <div class="box">Box 4</div>
    </section>

    <h4>Basic Flexbox (justified items)</h4>
    <section class="container demo-2">
      <div class="box">Box 1</div>
      <div class="box">Box 2</div>
      <div class="box">Box 3</div>
      <div class="box">Box 4</div>
    </section>

    <h4>Basic Flexbox (placement of items)</h4>
    <section class="container demo-3">
      <div class="box">Box 1</div>
      <div class="box">Box 2</div>
      <div class="box">Box 3</div>
      <div class="box">Box 4</div>
    </section>

    <h4>Basic Flexbox (direction)</h4>
    <section class="container demo-4">
      <div class="box">Box 1</div>
      <div class="box">Box 2</div>
      <div class="box">Box 3</div>
      <div class="box">Box 4</div>
    </section>

    <h4>rem and em units</h4>
    <section class="container demo-5">
      <p>Rem vs Em</p>
      <div class="box">Box 1</div>
      <div class="box">Box 2</div>
    </section>
    <br />
    <br />
    <br />
    <br />
    <br />
    <br />
    <br />
    <br />
    <br />
    <br />
    <br />
    <br />
  </body>
</html>
